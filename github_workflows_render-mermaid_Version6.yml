name: Render Mermaid to PNG

on:
  push:
    paths:
      - 'docs/*.mmd'
      - '.github/workflows/render-mermaid.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install mermaid-cli
        run: npm -g i @mermaid-js/mermaid-cli

      - name: Render .mmd files to .png
        run: |
          shopt -s nullglob
          for f in docs/*.mmd; do
            out="${f%.mmd}.png"
            echo "Rendering $f -> $out"
            mmdc -i "$f" -o "$out"
          done

      - name: Commit rendered PNGs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Render Mermaid diagrams to PNG"
          file_pattern: docs/*.png